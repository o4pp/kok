<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOTCHA Stream Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           CSS: KOTCHA PROFESSIONAL THEME
           ========================================= */
        :root {
            --bg-color: #050510;
            --glass-bg: rgba(20, 20, 40, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00f0ff;
            --secondary: #ff0055;
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a1a3a 0%, #050510 70%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Sidebar: Live Chat & Logs */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border-left: 1px solid var(--glass-border);
        }

        .header-title {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            background: -webkit-linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 12px;
            border-right: 3px solid var(--primary);
            animation: slideIn 0.3s ease-out forwards;
        }

        .chat-user { font-weight: bold; color: var(--primary); font-size: 14px; }
        .chat-text { font-size: 16px; margin-top: 4px; font-weight: bold; }

        /* Main Stage: Game Display */
        .main-stage {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .game-area {
            width: 90%;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.5s ease;
        }

        /* Game Specific UI: Rocket War */
        .rocket-war-ui { width: 100%; display: flex; flex-direction: column; gap: 30px; }
        .team-bar-container { width: 100%; display: flex; align-items: center; gap: 15px; }
        .team-label { font-size: 24px; font-weight: bold; width: 150px; text-align: left; }
        .progress-track { flex-grow: 1; height: 40px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; transition: width 0.3s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 15px; font-weight: bold;}
        .fill-a { background: linear-gradient(90deg, #0055ff, var(--primary)); width: 0%; }
        .fill-b { background: linear-gradient(90deg, #aa00ff, var(--secondary)); width: 0%; }

        /* Game Specific UI: Russian Roulette */
        .roulette-ui { text-align: center; }
        .gun-icon { font-size: 100px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        .bang-alert { font-size: 50px; color: var(--secondary); font-weight: 900; text-shadow: 0 0 20px var(--secondary); animation: shake 0.5s; display: none; }
        
        /* Game Specific UI: Code Breaker */
        .code-ui { display: flex; flex-direction: column; align-items: center; }
        .lock-icon { font-size: 80px; color: #ffd700; margin-bottom: 10px; }
        .code-history { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .guess-tag { background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 18px; }

        /* Admin Controls (Mockup for testing locally) */
        .admin-controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        button { background: var(--glass-bg); border: 1px solid var(--primary); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* System Messages */
        .system-msg { position: absolute; top: 20px; font-size: 24px; color: #00ff00; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <!-- Sidebar: Chat -->
    <div class="sidebar glass-panel">
        <div class="header-title">KOTCHA LIVE</div>
        <div class="chat-container" id="chat-container">
            <!-- Chat messages will appear here -->
        </div>
    </div>

    <!-- Main Stage -->
    <div class="main-stage">
        <div id="system-msg" class="system-msg"></div>
        
        <div class="game-area glass-panel" id="game-area">
            <h1 style="color: rgba(255,255,255,0.3); font-size: 3rem;">اختر اللعبة للبدء</h1>
        </div>

        <!-- أزرار تحكم للتجربة (يتم اخفائها في البث) -->
        <div class="admin-controls">
            <button onclick="startGame('ROCKET_WAR')">🚀 حرب الصواريخ</button>
            <button onclick="startGame('RUSSIAN_ROULETTE')">🔫 الروليت الروسي</button>
            <button onclick="startGame('CODE_BREAKER')">🔐 كاسر الشفرة</button>
            <button onclick="stopGame()" style="border-color: var(--secondary);">🛑 إيقاف</button>
        </div>
    </div>

    <script>
        // =========================================
        // JAVASCRIPT: LOGIC & WEBSOCKET
        // =========================================
        
        // ** قم بتغيير هذا الرابط إلى رابط Cloudflare Worker الخاص بك **
        const WORKER_URL = "your-worker.your-subdomain.workers.dev"; 
        const API_HTTP = `https://${WORKER_URL}/api`;
        const API_WS = `wss://${WORKER_URL}/api`;

        let ws;
        const gameArea = document.getElementById('game-area');
        const chatContainer = document.getElementById('chat-container');

        // اتصال WebSocket
        function connectWS() {
            try {
                ws = new WebSocket(API_WS);
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === "CHAT_MESSAGE") {
                        appendChat(data.data.user.username, data.data.comment);
                    } 
                    else if (data.type === "GAME_STARTED") {
                        showSystemMessage("تم بدء اللعبة: " + data.state.currentType);
                        renderGameUI(data.state);
                    }
                    else if (data.type === "STATE_UPDATE") {
                        updateGameUI(data.state);
                    }
                    else if (data.type === "GAME_EVENT") {
                        handleGameEvent(data);
                    }
                    else if (data.type === "GAME_STOPPED") {
                        gameArea.innerHTML = '<h1 style="color: rgba(255,255,255,0.3); font-size: 3rem;">انتهت اللعبة</h1>';
                    }
                };

                ws.onclose = () => setTimeout(connectWS, 2000); // Reconnect
            } catch (e) {
                console.log("WebSocket connection requires a valid Cloudflare URL.");
            }
        }

        function appendChat(username, text) {
            const el = document.createElement('div');
            el.className = 'chat-msg';
            el.innerHTML = `<div class="chat-user">${username}</div><div class="chat-text">${text}</div>`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showSystemMessage(msg) {
            const sys = document.getElementById('system-msg');
            sys.innerText = msg;
            sys.style.opacity = 1;
            setTimeout(() => sys.style.opacity = 0, 3000);
        }

        // --- Render UI Functions ---
        function renderGameUI(state) {
            if (state.currentType === 'ROCKET_WAR') {
                gameArea.innerHTML = `
                    <h2 style="font-size:3rem; margin-bottom:30px;">🚀 حرب الصواريخ</h2>
                    <div class="rocket-war-ui">
                        <div class="team-bar-container">
                            <div class="team-label" style="color: var(--primary);">فريق 1 (اكتب 1)</div>
                            <div class="progress-track"><div class="progress-fill fill-a" id="score-a">0</div></div>
                        </div>
                        <div class="team-bar-container">
                            <div class="team-label" style="color: var(--secondary);">فريق 2 (اكتب 2)</div>
                            <div class="progress-track"><div class="progress-fill fill-b" id="score-b">0</div></div>
                        </div>
                    </div>
                `;
            } 
            else if (state.currentType === 'RUSSIAN_ROULETTE') {
                gameArea.innerHTML = `
                    <div class="roulette-ui">
                        <h2 style="font-size:3rem; margin-bottom:10px;">🔫 الروليت الروسي</h2>
                        <p style="font-size:20px; color:#aaa; margin-bottom:30px;">اكتب "shoot" بالشات للتصويب!</p>
                        <div class="gun-icon">🔫</div>
                        <div class="bang-alert" id="bang-msg"></div>
                        <div style="margin-top:20px; font-size:24px;">تم إقصاء: <span id="eliminated-list" style="color:var(--secondary)">لا أحد</span></div>
                    </div>
                `;
            }
            else if (state.currentType === 'CODE_BREAKER') {
                gameArea.innerHTML = `
                    <div class="code-ui">
                        <div class="lock-icon">🔐</div>
                        <h2 style="font-size:3rem;">كاسر الشفرة</h2>
                        <p style="font-size:20px; color:#aaa; margin-bottom:20px;">خمن الرقم السري (4 أرقام) في الشات!</p>
                        <h1 style="font-size:4rem; letter-spacing: 15px; background: rgba(0,0,0,0.5); padding: 10px 40px; border-radius: 20px;">****</h1>
                        <div class="code-history" id="code-history"></div>
                    </div>
                `;
            }
        }

        function updateGameUI(state) {
            if (state.currentType === 'ROCKET_WAR') {
                const a = state.data.teamA_score;
                const b = state.data.teamB_score;
                const total = (a + b) || 1; // prevent divide by zero
                document.getElementById('score-a').style.width = \`\${(a/total)*100}%\`;
                document.getElementById('score-a').innerText = a;
                document.getElementById('score-b').style.width = \`\${(b/total)*100}%\`;
                document.getElementById('score-b').innerText = b;
            }
            else if (state.currentType === 'CODE_BREAKER') {
                const hist = state.data.history;
                const histDiv = document.getElementById('code-history');
                histDiv.innerHTML = hist.slice(-10).map(h => `<div class="guess-tag">${h.user}: <span style="color:var(--primary)">${h.guess}</span></div>`).join('');
            }
        }

        function handleGameEvent(data) {
            if (data.event === 'BANG') {
                const msgEl = document.getElementById('bang-msg');
                msgEl.innerText = data.msg;
                msgEl.style.display = 'block';
                setTimeout(() => msgEl.style.display = 'none', 2000);
            }
            else if (data.event === 'WINNER') {
                gameArea.innerHTML = `
                    <div style="text-align:center;">
                        <h1 style="font-size:5rem; color: #ffd700; text-shadow: 0 0 20px #ffd700; animation: shake 1s infinite;">🎉 فائز! 🎉</h1>
                        <h2 style="font-size:3rem; color:var(--primary)">${data.user.username}</h2>
                        <p style="font-size:24px; margin-top:20px;">استطاع فك الشفرة!</p>
                    </div>
                `;
            }
        }

        // --- API Calls (Admin) ---
        async function startGame(type) {
            // في الإنتاج، قم بتفعيل هذا الكود وارسال طلب للـ API
            /*
            fetch(API_HTTP + '/game/start', {
                method: 'POST',
                body: JSON.stringify({ gameType: type }),
                headers: { 'Content-Type': 'application/json' }
            });
            */
            // للمحاكاة الفورية بدون رفع السيرفر:
            const mockState = { currentType: type, data: { teamA_score: 0, teamB_score: 0, history: [] } };
            renderGameUI(mockState);
        }

        async function stopGame() {
            gameArea.innerHTML = '<h1 style="color: rgba(255,255,255,0.3); font-size: 3rem;">اختر اللعبة للبدء</h1>';
        }

        // Run
        connectWS();
    </script>
</body>
</html>
