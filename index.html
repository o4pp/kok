<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOTCHA | منصة البث التفاعلي وصناع المحتوى</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #121520;
            --bg-card: #1a1e2e;
            --accent-purple: #7928ca;
            --accent-cyan: #00dfd8;
            --accent-pink: #ff0080;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header Navigation --- */
        header {
            background: rgba(18, 21, 32, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        .user-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(121, 40, 202, 0.6);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* --- Hero Section --- */
        .hero {
            text-align: center;
            padding: 5rem 1rem;
            background: radial-gradient(circle at center, rgba(121, 40, 202, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        /* --- Main Content Grid --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-badge {
            background: var(--accent-pink);
            color: white;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .room-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .room-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .room-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* --- Modal Component --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
        }

        .modal-title {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 1rem;
        }

        .platform-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .platform-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .platform-btn.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 223, 216, 0.1);
        }

        /* --- Live Arena Area --- */
        .arena {
            display: none;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            height: calc(100vh - 120px);
        }

        .game-viewport {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .chat-viewport {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo">KOTCHA</div>
        <nav>
            <ul>
                <li><a href="#" class="active">الرئيسية</a></li>
                <li><a href="#">استكشف</a></li>
                <li><a href="#">الألعاب</a></li>
                <li><a href="#">الاشتراكات</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn btn-primary" onclick="openModal('createModal')">+ إنشاء بث</button>
            <button class="btn btn-secondary" id="loginBtn" onclick="loginOAuth('tiktok')">تسجيل الدخول</button>
        </div>
    </header>

    <!-- Main Dashboard Screen -->
    <div id="mainDashboard">
        <section class="hero">
            <h1>العب مع جمهورك مباشرة 🚀</h1>
            <p>منصة التفاعل المباشر الأولى لصناع المحتوى على TikTok, Twitch, و Kick.</p>
            <button class="btn btn-primary" onclick="openModal('createModal')">ابدأ البث الآن</button>
        </section>

        <div class="container">
            <h2 class="section-title"><span class="live-badge">LIVE</span> البثوث النشطة الآن</h2>
            <div class="rooms-grid" id="roomsContainer">
                <!-- Data dynamically populated from backend -->
            </div>
        </div>
    </div>

    <!-- Active Live Arena Screen -->
    <div class="container">
        <div class="arena" id="liveArena">
            <div class="game-viewport">
                <h2 id="currentRoomTitle">عنوان البث</h2>
                <div id="gameUI" style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted);">في انتظار بدء الجولة الأولى...</p>
                    <button class="btn btn-primary" style="margin-top: 1rem;" onclick="triggerGameAction()">تفاعل مع اللعبة 🔥</button>
                </div>
            </div>
            <div class="chat-viewport">
                <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 700;">الدردشة المباشرة</div>
                <div class="chat-messages" id="chatBox"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="form-control" placeholder="اكتب رسالتك...">
                    <button class="btn btn-primary" onclick="sendChatMessage()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Stream Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <h3 class="modal-title">إنشاء بث جديد</h3>
            <div class="form-group">
                <label>عنوان البث</label>
                <input type="text" id="streamTitle" class="form-control" placeholder="تحدي الجمهور اليوم 🔥">
            </div>
            <div class="form-group">
                <label>اختر اللعبة</label>
                <select id="gameType" class="form-control">
                    <option value="QUIZ">اختبار معلومات (Quiz)</option>
                    <option value="REACTION">سرعة البديهة (Reaction)</option>
                    <option value="VOTE">تصويت الجمهور (Vote)</option>
                </select>
            </div>
            <div class="form-group">
                <label>اختر المنصة</label>
                <div class="platform-selector">
                    <div class="platform-btn active" onclick="selectPlatform(this, 'TikTok')">TikTok</div>
                    <div class="platform-btn" onclick="selectPlatform(this, 'Twitch')">Twitch</div>
                    <div class="platform-btn" onclick="selectPlatform(this, 'Kick')">Kick</div>
                    <div class="platform-btn" onclick="selectPlatform(this, 'KOTCHA')">عام</div>
                </div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-primary" style="flex: 1;" onclick="submitCreateRoom()">بدء البث</button>
                <button class="btn btn-secondary" onclick="closeModal('createModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://kotcha.ig999x.workers.dev"; // رابط Backend الخادم
        let selectedPlatform = "TikTok";
        let activeWS = null;
        let currentUser = "زائر_" + Math.floor(Math.random() * 1000);

        // --- Initialize Page ---
        document.addEventListener("DOMContentLoaded", () => {
            fetchPublicRooms();
            checkUserAuth();
        });

        async function fetchPublicRooms() {
            try {
                const res = await fetch(`${API_BASE}/api/rooms/public`);
                const data = await res.json();
                const container = document.getElementById("roomsContainer");
                container.innerHTML = "";

                data.rooms.forEach(room => {
                    container.innerHTML += `
                        <div class="room-card" onclick="joinRoom('${room.code}', '${room.title}')">
                            <div class="room-header">
                                <span>${room.platform}</span>
                                <span>👁️ ${room.viewers}</span>
                            </div>
                            <div class="room-title">${room.title}</div>
                            <button class="btn btn-secondary" style="width: 100%;">دخول الغرفة</button>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("فشل جلب الغرفة العامة", e);
            }
        }

        async function checkUserAuth() {
            try {
                const res = await fetch(`${API_BASE}/api/auth/me`);
                const data = await res.json();
                if (data.authenticated) {
                    document.getElementById("loginBtn").innerText = data.user.displayName;
                    currentUser = data.user.displayName;
                }
            } catch (e) {}
        }

        function loginOAuth(platform) {
            window.location.href = `${API_BASE}/api/oauth/${platform}/start`;
        }

        // --- Room Creation & Joining ---
        function selectPlatform(element, platform) {
            document.querySelectorAll(".platform-btn").forEach(btn => btn.classList.remove("active"));
            element.classList.add("active");
            selectedPlatform = platform;
        }

        async function submitCreateRoom() {
            const title = document.getElementById("streamTitle").value || "بث KOTCHA التفاعلي";
            const gameType = document.getElementById("gameType").value;

            try {
                const res = await fetch(`${API_BASE}/api/rooms/create`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, gameType, platform: selectedPlatform })
                });

                const data = await res.json();
                if (data.success) {
                    closeModal("createModal");
                    joinRoom(data.room.code, data.room.title);
                }
            } catch (e) {
                alert("حدث خطأ أثناء إنشاء الغرفة");
            }
        }

        function joinRoom(roomCode, title) {
            document.getElementById("mainDashboard").style.display = "none";
            document.getElementById("liveArena").style.display = "grid";
            document.getElementById("currentRoomTitle").innerText = title;

            // Connect WebSocket Cleanly via WebServer Bridge
            const wsUrl = `wss://kotcha.ig999x.workers.dev/api/ws?code=${roomCode}`;
            activeWS = new WebSocket(wsUrl);

            activeWS.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "NEW_CHAT") {
                    appendChat(data.user, data.text);
                }
                if (data.type === "GAME_UPDATE") {
                    appendChat("النظام 🤖", "تم تحديث نقاط اللعبة!");
                }
            };
        }

        // --- Real-time Actions ---
        function sendChatMessage() {
            const input = document.getElementById("chatInput");
            if (input.value.trim() && activeWS) {
                activeWS.send(JSON.stringify({
                    type: "CHAT_MESSAGE",
                    user: currentUser,
                    text: input.value
                }));
                input.value = "";
            }
        }

        function triggerGameAction() {
            if (activeWS) {
                activeWS.send(JSON.stringify({
                    type: "PLAYER_ACTION",
                    user: currentUser,
                    points: 100
                }));
            }
        }

        function appendChat(user, text) {
            const box = document.getElementById("chatBox");
            box.innerHTML += `<div><strong>${user}:</strong> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function openModal(id) { document.getElementById(id).style.display = "flex"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }
    </script>
</body>
</html>
